name: Send Telegram notification
description: >-
  Send a status notification to the Shanios Telegram channel. No-op (exit 0,
  with a warning) when either token input is empty, so a repo without the
  TELEGRAM_* secrets does not fail its workflows. Replaces the 9+
  copy-pasted inline curl blocks that used to live in build-ami.yml /
  promote-stable.yml / build-image.yml. Composite actions cannot read the
  calling repo's `secrets` context — callers MUST pass bot-token/chat-id
  as inputs from their own step, where ${{ secrets.* }} is legal.

inputs:
  status:
    description: "Build status (success, failure, started)"
    required: false
    default: "success"
  message:
    description: "Notification message content (Markdown, no emoji)"
    required: true
  repo-name:
    description: "Display name of the repo, rendered after the emoji"
    required: false
    default: ""
  bot-token:
    description: "Telegram bot token — pass ${{ secrets.TELEGRAM_BOT_TOKEN }} at the call site"
    required: false
    default: ""
  chat-id:
    description: "Telegram chat ID — pass ${{ secrets.TELEGRAM_CHAT_ID }} at the call site"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Telegram notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
        TELEGRAM_MESSAGE: ${{ inputs.message }}
        TELEGRAM_STATUS: ${{ inputs.status }}
        TELEGRAM_REPO: ${{ inputs.repo-name }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping notification"
          exit 0
        fi
        case "$TELEGRAM_STATUS" in
          success) EMOJI="✅" ;;
          failure) EMOJI="❌" ;;
          started) EMOJI="🚀" ;;
          *)        EMOJI="ℹ️" ;;
        esac
        if [ -n "$TELEGRAM_REPO" ]; then
          TEXT="${EMOJI} **${TELEGRAM_REPO}** — ${TELEGRAM_MESSAGE} (${TELEGRAM_STATUS})"
        else
          # Inline-caller shape: message already carries its own status
          # wording ("Build Started", "Build Complete"), so no suffix —
          # the (status) suffix is only for the workflow_call path, which
          # always passes a repo-name.
          TEXT="${EMOJI} ${TELEGRAM_MESSAGE}"
        fi
        PAYLOAD=$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
          '{chat_id: $chat, text: $text, parse_mode: "Markdown"}')
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          || echo "Telegram notification failed"