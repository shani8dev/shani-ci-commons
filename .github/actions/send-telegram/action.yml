name: Send Telegram notification
description: >-
  Send a status notification to the Shanios Telegram channel. No-op (exit 0,
  with a warning) when the TELEGRAM_* secrets are absent, so a repo without
  them does not fail its workflows. Replaces the 9+ copy-pasted inline curl
  blocks that used to live in build-ami.yml / promote-stable.yml /
  build-image.yml — composite actions can read `secrets` directly, which the
  workflow_call equivalent cannot do for job-level env.

inputs:
  status:
    description: "Build status (success, failure, started)"
    required: false
    default: "success"
  message:
    description: "Notification message content (Markdown, no emoji)"
    required: true
  repo-name:
    description: "Display name of the repo, rendered after the emoji"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Telegram notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_MESSAGE: ${{ inputs.message }}
        TELEGRAM_STATUS: ${{ inputs.status }}
        TELEGRAM_REPO: ${{ inputs.repo-name }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping notification"
          exit 0
        fi
        case "$TELEGRAM_STATUS" in
          success) EMOJI="✅" ;;
          failure) EMOJI="❌" ;;
          started) EMOJI="🚀" ;;
          *)        EMOJI="ℹ️" ;;
        esac
        if [ -n "$TELEGRAM_REPO" ]; then
          TEXT="${EMOJI} **${TELEGRAM_REPO}** — ${TELEGRAM_MESSAGE} (${TELEGRAM_STATUS})"
        else
          TEXT="${EMOJI} ${TELEGRAM_MESSAGE} (${TELEGRAM_STATUS})"
        fi
        PAYLOAD=$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
          '{chat_id: $chat, text: $text, parse_mode: "Markdown"}')
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          || echo "Telegram notification failed"