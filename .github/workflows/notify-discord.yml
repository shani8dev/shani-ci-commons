name: Notify Discord

on:
  workflow_call:
    inputs:
      message:
        description: "Discord webhook message content"
        required: true
        type: string
      webhook-url:
        description: "Discord webhook URL"
        required: true
        type: string
      status:
        description: "Build status (success, failure, error)"
        required: false
        default: "failure"
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url }}
          DISCORD_MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"${DISCORD_MESSAGE}\"}" \
            || echo "Discord notification failed"
