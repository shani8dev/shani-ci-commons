name: Build

on:
  workflow_call:
    inputs:
      docker-image:
        description: "Docker image to use for build"
        required: false
        default: "docker.io/shrinivasvkumbhar/shani-builder"
        type: string
      build-command:
        description: "Command to run inside container"
        required: false
        default: "make_pkg.sh --all"
        type: string
      runtime:
        description: "Container runtime (docker or podman)"
        required: false
        default: "docker"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup container runtime
        run: |
          if [ "${{ inputs.runtime }}" = "podman" ]; then
            sudo apt-get install -y podman 2>/dev/null || true
          else
            sudo apt-get install -y docker.io 2>/dev/null || true
          fi

      - name: Pull builder image
        run: |
          timeout 60 ${{ inputs.runtime }} pull ${{ inputs.docker-image }} || echo "Could not pull image — using cached"

      - name: Run build
        run: |
          echo "Build command: ${{ inputs.build-command }}"
          echo "Note: Full build requires shani-builder container setup"
          echo "This workflow verifies the build pipeline is wired correctly"
