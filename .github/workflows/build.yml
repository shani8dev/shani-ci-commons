name: Build

on:
  workflow_call:
    inputs:
      build-type:
        description: "Type of build (docker, manifest, or container)"
        required: false
        default: ""
        type: string
      docker-image:
        description: "Docker image to use for container build"
        required: false
        default: ""
        type: string
      build-command:
        description: "Command to run inside container"
        required: false
        default: ""
        type: string
      runtime:
        description: "Container runtime (docker or podman)"
        required: false
        default: "docker"
        type: string
      manifest-script:
        description: "Script to run for build-type 'manifest' (repo-relative)"
        required: false
        default: "generate-manifest.js"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker image build
        if: inputs.build-type == 'docker'
        run: |
          docker build -f ./docker/Dockerfile -t shani-builder:ci .

      - name: Manifest build (${{ inputs.manifest-script }})
        if: inputs.build-type == 'manifest'
        run: |
          node ./${{ inputs.manifest-script }}

      - name: Container build
        if: inputs.build-type == 'container'
        run: |
          if [ -z "${{ inputs.docker-image }}" ]; then
            echo "::error::build-type 'container' requires docker-image input"
            exit 1
          fi
          timeout 60 ${{ inputs.runtime }} pull "${{ inputs.docker-image }}" || {
            echo "::warning::Could not pull ${{ inputs.docker-image }} — using cached if present"
          }
          if [ -z "${{ inputs.build-command }}" ]; then
            echo "::error::build-type 'container' requires build-command input"
            exit 1
          fi
          ${{ inputs.runtime }} run --rm \
            -v "$PWD":/work -w /work \
            "${{ inputs.docker-image }}" \
            bash -lc "${{ inputs.build-command }}"