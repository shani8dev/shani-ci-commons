name: Test

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language (bash or python)"
        required: false
        default: ""
        type: string
      test-command:
        description: "Command to run tests"
        required: false
        default: "bash tests/run-all.sh"
        type: string
      requirements-dir:
        description: "Directory holding requirements*.txt (e.g. server)"
        required: false
        default: "."
        type: string
      apt-packages:
        description: "Ubuntu packages to install first (e.g. python3-gi gir1.2-gtk-4.0)"
        required: false
        default: ""
        type: string
      system-site-packages:
        description: "Test in a venv over the runner's /usr/bin/python3 and its distro packages (PyGObject/GTK) instead of setup-python"
        required: false
        type: boolean
        default: false
      extra-repositories:
        description: >-
          Other repos to check out beside this one before the tests, as JSON:
          [{"repo": "owner/name", "path": "../name"}]. For suites that assert
          against a sibling checkout's files (shani-chronoa reads
          shani-pkgbuilds/shani-chronoa/PKGBUILD). The path is relative to the
          workspace, and a ../ prefix puts the clone outside it, which is what
          actions/checkout needs. Shallow, at the default branch: these are
          inputs to the tests, not the thing under test.
        required: false
        type: string
        default: "[]"
      python-version:
        description: "Python version for test dependencies"
        required: false
        default: "3.12"
        type: string
      runs-on:
        description: >-
          Runner image. With system-site-packages the suite tests against the
          runner's own GTK/libadwaita/PyGObject, so a repo that needs a newer
          stack than ubuntu-latest ships (shani-chronoa needs libadwaita newer
          than 24.04's 1.5) names the image here.
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out sibling repos the tests read
        if: inputs.extra-repositories != '[]' && inputs.extra-repositories != ''
        env:
          EXTRA_REPOS: ${{ inputs.extra-repositories }}
        run: |
          set -euo pipefail
          echo "$EXTRA_REPOS" | jq -r '.[] | "\(.repo)\t\(.path)"' | while IFS=$'\t' read -r repo path; do
            [ -n "$repo" ] || continue
            # The path is resolved against $GITHUB_WORKSPACE's parent, because
            # actions/checkout refuses a path inside the workspace.
            dest="$GITHUB_WORKSPACE/$path"
            mkdir -p "$(dirname "$dest")"
            echo "::group::checkout $repo -> $path"
            git clone --depth 1 "https://github.com/$repo.git" "$dest"
            echo "::endgroup::"
          done
          ls -d "$GITHUB_WORKSPACE"/../*/ | sed 's/^/sibling: /'

      - name: Install Ubuntu packages
        if: inputs.apt-packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ inputs.apt-packages }}

      - name: Setup Python
        if: (inputs.language == 'python' || inputs.language == '') && !inputs.system-site-packages
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # PyGObject cannot be pip-built without cairo/GI headers and does not
      # see the distro typelibs from a setup-python interpreter; a venv over
      # the system python sees both (python3-gi + gir1.2-*).
      - name: System-site venv
        if: inputs.system-site-packages
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: inputs.language == 'python' || inputs.language == ''
        working-directory: ${{ inputs.requirements-dir }}
        run: |
          # requirements-test.txt (requirements.txt + pytest + httpx) first —
          # it is what makes the test step's `pytest` actually runnable.
          # Verified live: the previous order (lock/txt first) left pytest
          # absent in shani-insights and the test step died with
          # "pytest: command not found" (exit 127).
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          elif [ -f requirements.lock ]; then
            pip install -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install pytest 2>/dev/null || true
          fi
          # Belt-and-braces: ensure pytest/httpx exist even if no test
          # requirements file was present, rather than letting the test
          # step fail with 127.
          pip install pytest httpx 2>/dev/null || true

      - name: Run tests
        run: ${{ inputs.test-command }}