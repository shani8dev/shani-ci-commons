name: Security

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Type of security scan (checksum, secrets, or all)"
        required: false
        default: "all"
        type: string
      skip-secrets:
        description: "Skip secrets scanning"
        required: false
        default: "false"
        type: string

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The keyring repo is checked out as a CHILD path (actions/checkout@v4
      # rejects any `path` resolving outside the caller's repo dir — the
      # sibling `../shani-keyring` layout is how every recent Security run
      # died). It CANNOT be `shani-keyring`: shani-pkgbuilds already tracks
      # its own `shani-keyring/` directory (that repo's PKGBUILD + .install),
      # and checkout@v4 refuses to clone into a non-empty existing dir
      # ("destination path already exists and is not an empty directory"),
      # which is the failure that replaced the original path-trap. Use the
      # collision-free name `shani-keyring-repo` instead. The test harness
      # auto-detects whichever layout it's given.
      - name: Checkout shani-keyring
        if: inputs.scan-type == 'checksum' || inputs.scan-type == 'all'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-keyring
          path: shani-keyring-repo

      - name: Keyring checksum sync (TDD harness)
        if: inputs.scan-type == 'checksum' || inputs.scan-type == 'all'
        run: |
          bash tests/test-check-keyring-sync.sh

      - name: Secret scanning
        if: inputs.scan-type == 'secrets' || inputs.scan-type == 'all'
        run: |
          if [ "${{ inputs.skip-secrets }}" = "true" ]; then
            echo "Secrets scan skipped by input"
            exit 0
          fi
          echo "Scanning for potential secrets..."
          # Match on commit-added secret shapes; ignore test fixtures and
          # placeholders. Not a substitute for a real secret scanner.
          # Capture to a file first: `grep ... | head -20 || echo ...` never
          # fails the step even on a real match, because without
          # `pipefail` the pipeline's exit status is head's (near-always 0),
          # not grep's — confirmed live, a planted fake ghp_ token still
          # exited 0. Check the match count directly instead.
          matches=$(grep -rn -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            --include='*.sh' --include='*.py' --include='*.yml' --include='*.yaml' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=cache . || true)
          if [ -n "$matches" ]; then
            echo "$matches" | head -20
            echo "::error::Potential secret(s) found — see matches above (basic pattern match, not a substitute for a dedicated scanner)"
            exit 1
          fi
          echo "No obvious secrets found"