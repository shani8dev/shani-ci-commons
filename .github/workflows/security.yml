name: Security

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Type of security scan (checksum, secrets, or all)"
        required: false
        default: "all"
        type: string
      skip-secrets:
        description: "Skip secrets scanning"
        required: false
        default: "false"
        type: string

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout shani-keyring (sibling — test harness expects ../shani-keyring)
        if: inputs.scan-type == 'checksum' || inputs.scan-type == 'all'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-keyring
          path: ../shani-keyring

      - name: Keyring checksum sync (TDD harness)
        if: inputs.scan-type == 'checksum' || inputs.scan-type == 'all'
        run: |
          bash tests/test-check-keyring-sync.sh

      - name: Secret scanning
        if: inputs.scan-type == 'secrets' || inputs.scan-type == 'all'
        run: |
          if [ "${{ inputs.skip-secrets }}" = "true" ]; then
            echo "Secrets scan skipped by input"
            exit 0
          fi
          echo "Scanning for potential secrets..."
          # Match on commit-added secret shapes; ignore test fixtures and
          # placeholders. Not a substitute for a real secret scanner.
          grep -rn -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            --include='*.sh' --include='*.py' --include='*.yml' --include='*.yaml' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=cache . \
            | head -20 || echo "No obvious secrets found"
          echo "Secret scan complete (basic pattern match — use dedicated tools for production)"