name: Lint

on:
  workflow_call:
    inputs:
      language:
        description: "Language to lint (bash, python, or all)"
        required: false
        default: "all"
        type: string
      shellcheck-version:
        description: "shellcheck version to use (accepted for backward compat)"
        required: false
        default: "v0.10.0.1"
        type: string
      python-version:
        description: "Python version for py_compile"
        required: false
        default: "3.12"
        type: string
      pre-commit-version:
        description: "pre-commit version to use (accepted for backward compat)"
        required: false
        default: "v4.1.0"
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shellcheck (bash scripts)
        if: inputs.language == 'bash' || inputs.language == 'all'
        run: |
          if ! command -v shellcheck &>/dev/null; then
            echo "shellcheck not preinstalled — installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          # tracked only (no build artifacts); --shell=bash so shebang-less
          # scripts are checked against the caller's declared language.
          files=$(git ls-files '*.sh' '*.bash')
          if [ -n "$files" ]; then
            shellcheck --shell=bash -S error $files
          else
            echo "No tracked shell scripts — nothing to lint"
          fi

      - name: Python syntax check
        if: inputs.language == 'python' || inputs.language == 'all'
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then
            python3 -m py_compile $files
          else
            echo "No tracked Python files — nothing to check"
          fi